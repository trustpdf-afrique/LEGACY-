<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTV Moyenne — ADMINISTRATEUR</title>
    <!-- CSS / Style -->
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .share-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .share-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e40af;
        }

        .share-flex {
            display: flex;
            gap: 10px;
        }

        .share-flex input {
            flex: 1;
            padding: 10px;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            background-color: #fff;
            font-size: 0.95rem;
        }

        .share-flex button {
            padding: 10px 18px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .share-flex button:hover {
            background-color: #1d4ed8;
        }

        .hidden {
            display: none !important;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-logout {
            background-color: #ef4444;
            padding: 8px 16px;
            font-size: 0.9rem;
            width: auto;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ========================================== -->
        <!-- 1. PAGE DE CONNEXION ADMINISTRATEUR        -->
        <!-- ========================================== -->
        <div id="loginSection" class="card">
            <div class="header">
                <h1>🔐 ZTV Moyenne</h1>
                <p>Espace de Connexion Administrateur</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="adminEmail">Email Administrateur</label>
                    <input type="email" id="adminEmail" placeholder="admin@ztvmoyenne.com" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Mot de passe</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Se connecter au Dashboard</button>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- 2. TABLEAU DE BORD ADMINISTRATEUR          -->
        <!-- ========================================== -->
        <div id="dashboardSection" class="card hidden">
            
            <div class="top-bar">
                <h2>📊 Tableau de Bord Administrateur</h2>
                <button onclick="handleLogout()" class="btn btn-logout">Déconnexion</button>
            </div>

            <!-- BLOC : LIEN OFFICIEL POUR LES ÉLÈVES -->
            <div class="share-box">
                <label for="eleveUrl">🔗 Lien officiel à partager aux Élèves / Participants :</label>
                <div class="share-flex">
                    <input type="text" id="eleveUrl" value="https://votre-domaine.com/eleves.html" readonly>
                    <button type="button" onclick="copyEleveLink()">Copier le lien</button>
                </div>
            </div>

            <!-- SECTION GESTION DONNÉES / FIREBASE -->
            <div id="adminControls">
                <h3> Données et Configurations</h3>
                <p style="margin-top: 10px; color: #64748b;">
                    Vos fonctionnalités d'administration, la gestion des moyennes et la base de données Firebase sont connectées et prêtes.
                </p>
                <!-- Conservez et insérez vos blocs de gestion habituels ici -->
            </div>

        </div>

    </div>

    <!-- ========================================== -->
    <!-- 3. CONFIGURATION & LOGIQUE FIREBASE        -->
    <!-- ========================================== -->
    <script type="module">
        // Importation des SDKs Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Vos identifiants Firebase (Conservés tels quels)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_PROJECT_ID.appspot.com",
            messagingSenderId: "VOTRE_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Ajuster dynamiquement l'URL du lien élèves en fonction du domaine actuel
        window.addEventListener('DOMContentLoaded', () => {
            const currentOrigin = window.location.origin;
            const currentPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            document.getElementById('eleveUrl').value = `${currentOrigin}${currentPath}/eleves.html`;
        });

        // Écouteur d'état d'authentification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Administrateur connecté
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                // Non connecté -> Afficher le login Admin
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        });

        // Connexion Admin
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Erreur de connexion : " + error.message);
            }
        };

        // Déconnexion Admin
        window.handleLogout = () => {
            signOut(auth);
        };

        // Copier le lien Élèves
        window.copyEleveLink = () => {
            const copyText = document.getElementById("eleveUrl");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Lien Élèves copié dans le presse-papier !");
        };
    </script>
</body>
</html>
